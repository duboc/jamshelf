name: Deploy Jamshelf Aurora (Separate Cloud Run Service)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-jamshelf-aurora
  cancel-in-progress: false

jobs:
  deploy-aurora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/984391209153/locations/global/workloadIdentityPools/github/providers/jamshelf
          service_account: github-deployer@riojucu.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Separate Cloud Run service sharing the same Jamshelf backend APIs, Firestore, and GCS bucket.
      - name: Deploy jamshelf-aurora
        run: >
          gcloud run deploy jamshelf-aurora
          --source .
          --region us-central1
          --project riojucu
          --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe jamshelf-aurora --region us-central1 --project riojucu --format='value(status.url)')
          for path in / /api/setlists; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
