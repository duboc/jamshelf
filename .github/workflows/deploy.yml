name: Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # OIDC token for keyless auth to Google Cloud

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/984391209153/locations/global/workloadIdentityPools/github/providers/jamshelf
          service_account: github-deployer@riojucu.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Same command as a manual deploy (docs/RUNBOOK.md). Runtime env vars
      # live on the Cloud Run service and survive source redeploys.
      - name: Deploy jamshelf
        run: >
          gcloud run deploy jamshelf
          --source .
          --region us-central1
          --project riojucu
          --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe jamshelf --region us-central1 --project riojucu --format='value(status.url)')
          for path in / /api/setlists; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
